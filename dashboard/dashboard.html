<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #080d1d, #101d3a, #142d52);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: #111c32;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Logout Button */
        .btn-light {
            background: #1b2942;
            color: #ffffff;
            border: 1px solid #34445f;
            border-radius: 8px;
        }

        .btn-light:hover {
            background: #2878ff;
            color: #ffffff;
        }

        /* Greeting */
        h2 {
            color: #ffffff;
            letter-spacing: -1px;
        }

        h4 {
            color: #ffffff;
        }

        .text-secondary {
            color: #9caec8 !important;
        }

        /* Todo Card */
        .card {
            background: #111c32;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        /* Input */
        .form-control {
            background: #1b2942;
            border: 1px solid #34445f;
            color: #ffffff;
            padding: 13px 15px;
            border-radius: 10px;
        }

        .form-control::placeholder {
            color: #8292aa;
        }

        .form-control:focus {
            background: #1b2942;
            color: #ffffff;
            border-color: #3985ff;
            box-shadow: 0 0 0 3px rgba(57, 133, 255, 0.15);
        }

        /* Primary Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #2878ff, #00a6ff);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1765e8, #008bd9);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 132, 255, 0.25);
        }

        /* Todo List */
        .list-group-item {
            background: #1b2942;
            color: #e2eaff;
            border-color: #34445f;
            padding: 13px 15px;
        }

        .list-group-item:first-child {
            border-top: 1px solid #34445f;
            border-radius: 10px 10px 0 0;
        }

        .list-group-item:last-child {
            border-radius: 0 0 10px 10px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark shadow-sm py-3">
        <div class="container">
            <span class="navbar-brand fw-bold">My Dashboard</span>
            <button class="btn btn-light btn-sm fw-semibold px-3" id="logout">Logout</button>
        </div>
    </nav>

    <!-- Dashboard -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Greeting -->
                <div class="text-center mb-4">
                    <span class="badge rounded-pill bg-primary bg-opacity-25 text-info px-3 py-2 mb-3">
                        YOUR PERSONAL SPACE
                    </span>
                    <h2 class="fw-bold" id="greeting-text"></h2>
                    <p class="text-secondary">Manage your daily tasks easily.</p>
                </div>

                <!-- Todo Card -->
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h4 class="fw-bold mb-2">My Todo List</h4>
                    <p class="text-secondary small mb-4">Stay organized and complete your tasks.</p>
                    <!-- Input Group -->
                    <div class="input-group mb-4">
                        <input type="text" class="form-control" id="todo-input" placeholder="Enter your task..."/>
                        <button class="btn btn-primary px-4" id="todo-btn">
                            Add
                        </button>
                    </div>

                    <!-- Todo List -->
                    <ul class="list-group list-group-flush" id="todos">
                    </ul>
                </div>
                <!-- Footer -->
                <p class="text-center text-secondary small mt-4">
                    Stay Focused · Stay Productive</p>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase -->
    <script type="module" src="../firebase.config.js"></script>
    <script type="module" src="../index.js"></script>
    <script type="module" src="./dashboard.js"></script>

</body>
</html>
