<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #080d1d, #101d3a, #142d52);
            min-height: 100vh;
        }

        .card {
            background: #111c32;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4) !important;
        }

        .card-body {
            padding: 20px 10px;
        }

        h2 {
            color: #ffffff;
            letter-spacing: -1px;
        }

        .text-secondary {
            color: #9caec8 !important;
        }

        .form-label {
            color: #e2eaff;
        }

        .form-control {
            background-color: #1b2942;
            border: 1px solid #34445f;
            color: #ffffff;
            padding: 13px 15px;
            border-radius: 10px;
            font-size: 15px;
        }

        .form-control::placeholder {
            color: #8292aa;
        }

        .form-control:focus {
            background-color: #1b2942;
            color: #ffffff;
            border-color: #3985ff;
            box-shadow: 0 0 0 3px rgba(57, 133, 255, 0.15);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2878ff, #00a6ff);
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1765e8, #008bd9);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 132, 255, 0.25);
        }

        a {
            color: #55a3ff;
        }

        a:hover {
            color: #8ac0ff;
        }
    </style>
</head>
<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
        <div class="card shadow-sm border-0 rounded-4 p-4" style="max-width: 420px; width: 100%;">
            <div class="card-body">

                <!-- Heading -->
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <span class="badge rounded-pill bg-primary bg-opacity-25 text-info px-3 py-2">WELCOME BACK</span>
                    </div>
                    <h2 class="text-center fw-bold mb-2">Welcome Back!</h2>
                    <p class="text-center text-secondary mb-4">Login to your account
                    </p>
                </div>
                <form id="login-form">
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="login-email" class="form-label fw-semibold">Email Address</label>
                        <input type="email"class="form-control form-control-lg" id="login-email" placeholder="Enter your email" required/>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="login-password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control form-control-lg" id="login-password" placeholder="Enter your password" required/>
                    </div>

                    <!-- Signup Link -->
                    <div class="text-center mb-4">
                        <span class="text-secondary">Don't have an account?</span>
                        <a href="../signup/signup.html" class="text-decoration-none fw-semibold">Sign Up</a>
                    </div>
                    <!-- Login Button -->
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        Login
                    </button>
                </form>
                <p class="text-center text-secondary small mt-4 mb-0">Secure Login · Welcome Back
                </p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase -->
    <script type="module" src="../firebase.config.js"></script>
    <script type="module" src="../index.js"></script>
</body>
</html>
