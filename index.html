```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | My Todo App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #080d1d, #101d3a, #142d52);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        /* Intro Card */
        .intro-card {
            background: #111c32;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 55px 35px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        /* Icon */
        .icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        /* Heading */
        h1 {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* Description */
        p {
            color: #9caec8;
            line-height: 1.7;
            font-size: 16px;
        }

        /* Badge */
        .badge {
            background: rgba(40, 120, 255, 0.15);
            color: #00a6ff;
            padding: 10px 18px;
            border-radius: 30px;
            margin-bottom: 20px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Button */
        .btn-primary {
            background: linear-gradient(135deg, #2878ff, #00a6ff);
            border: none;
            border-radius: 10px;
            padding: 13px 35px;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1765e8, #008bd9);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 132, 255, 0.25);
        }

        /* Footer */
        .footer {
            color: #8292aa;
            font-size: 13px;
            margin-top: 30px;
        }

        @media (max-width: 576px) {
            .intro-card {
                padding: 40px 22px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="intro-card">

        <!-- Icon -->
        <div class="icon">
            📝
        </div>

        <!-- Badge -->
        <span class="badge">
            YOUR PERSONAL SPACE
        </span>

        <!-- Heading -->
        <h1>Welcome to My Todo App</h1>

        <!-- Description -->
        <p>
            Organize your daily tasks, manage your time,
            and stay productive with your personal
            Todo Dashboard.
        </p>

        <p>
            Start your journey towards a more organized life!
        </p>

        <!-- Get Started Button -->
        <a href="./signup/signup.html" class="btn btn-primary mt-3">
            Get Started →
        </a>

        <!-- Footer -->
        <div class="footer">
            Stay Focused · Stay Productive
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
```
